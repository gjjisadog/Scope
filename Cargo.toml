[package]
name = "scope_analyzer"
version = "0.15.2"
edition = "2021"
description = "Windows DSP oscilloscope and engineering waveform analysis workbench"
license = "Proprietary"

[[bin]]
name = "scope-cli"
path = "src/bin/scope_cli.rs"

[[bin]]
name = "scope-hardware-smoke"
path = "src/bin/scope_hardware_smoke.rs"

[dependencies]
ab_glyph = "0.2"
csv = "1.4"
crossbeam-channel = "0.5"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui_plot = "0.27"
encoding_rs = "0.8"
rfd = "0.14"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4", default-features = false }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[patch.crates-io]
eframe = { path = "vendor/eframe-0.27.2-angle" }
egui-wgpu = { path = "vendor/egui-wgpu-0.27.2-fallback" }
egui_plot = { path = "vendor/egui_plot-0.27.2-shared" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
