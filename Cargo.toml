[package]
name = "scope_analyzer"
version = "0.1.0"
edition = "2021"
description = "Windows offline oscilloscope-style waveform analyzer"
license = "Proprietary"

[dependencies]
eframe = "0.27"
egui_plot = "0.27"
rfd = "0.14"
rustfft = "6.2"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

